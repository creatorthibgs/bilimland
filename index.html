<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimClass Enterprise — Мемлекеттік электронды білім беру жүйесі</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .gov-header { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); }
        .gov-table th { background-color: #e2e8f0; color: #334155; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; border: 1px solid #cbd5e1; padding: 8px; }
        .gov-table td { border: 1px solid #cbd5e1; padding: 6px 8px; background-color: #ffffff; font-size: 11px; }
        .sidebar-btn { transition: all 0.2s ease; }
        .sidebar-btn:hover { background-color: #f8fafc; color: #2563eb; }
        .sidebar-btn.active { background-color: #eff6ff; color: #1d4ed8; border-left: 4px solid #1d4ed8; font-weight: 700; }
        .animate-fade { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- HEADER: BilimClass Govt Standard -->
    <header class="gov-header sticky top-0 z-50 py-3 px-6 shadow-md flex justify-between items-center text-white">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded bg-white text-blue-900 flex items-center justify-center font-black text-sm shadow">BC</div>
            <div>
                <h1 class="text-xs font-extrabold tracking-wider">BilimClass <span class="text-[9px] px-1.5 py-0.5 bg-blue-600 text-white rounded font-bold ml-1">Enterprise Cloud</span></h1>
                <p class="text-[9px] text-slate-300">Мемлекеттік бірыңғай мектеп журналы</p>
            </div>
        </div>
        <div id="user-info" class="hidden flex items-center space-x-4">
            <div class="text-right">
                <span id="welcome-text" class="text-xs font-bold block text-white"></span>
                <span id="welcome-role" class="text-[9px] text-blue-300 font-semibold block uppercase tracking-wider"></span>
            </div>
            <button onclick="logout()" class="px-3 py-1.5 bg-red-600/80 hover:bg-red-600 text-white rounded text-xs font-bold transition-all shadow-xs">Жүйеден шығу</button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 max-w-[1400px] w-full mx-auto p-4 flex flex-col">
        
        <!-- LOGIN SECTION -->
        <div id="login-section" class="w-full max-w-md mx-auto my-auto bg-white p-8 rounded-xl shadow-xl border border-slate-200 animate-fade">
            <div class="text-center mb-6">
                <h2 class="text-lg font-extrabold text-slate-900">Жүйеге кіру</h2>
                <p class="text-slate-500 text-xs mt-1">BilimClass бірыңғай электронды журналы</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-600 mb-1">Логин</label>
                    <input type="text" id="login-username" required class="w-full border border-slate-300 rounded px-3 py-2 text-xs focus:outline-none focus:border-blue-600" placeholder="Логиніңіз">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-600 mb-1">Пароль</label>
                    <input type="password" id="login-password" required class="w-full border border-slate-300 rounded px-3 py-2 text-xs focus:outline-none focus:border-blue-600" placeholder="••••••••">
                </div>
                <div id="login-error" class="hidden text-red-600 text-xs text-center font-bold bg-red-50 p-2 rounded border border-red-200"></div>
                <button type="submit" class="w-full py-2.5 bg-blue-700 hover:bg-blue-800 text-white rounded font-bold text-xs shadow transition-all">Кіру</button>
            </form>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section" class="hidden grid grid-cols-1 md:grid-cols-5 gap-4 w-full items-start animate-fade">
            <aside class="bg-white rounded-xl p-3 md:col-span-1 shadow-sm border border-slate-200 sticky top-16">
                <div class="text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-2 px-2">Басқару панелі</div>
                <nav id="sidebar-menu" class="space-y-1 text-xs font-semibold text-slate-600"></nav>
            </aside>
            <main class="md:col-span-4 space-y-3">
                <!-- WARNING NOTIFICATION BANNER FOR STUDENTS -->
                <div id="student-warning-banner" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-800 text-xs shadow-xs flex items-center space-x-3">
                    <span class="text-base">⚠️</span>
                    <div>
                        <b class="font-bold">Әкімшілік тарапынан ескерту берілді:</b>
                        <span id="student-warning-reason"></span>
                    </div>
                </div>

                <!-- ANNOUNCEMENT BANNER -->
                <div id="announcement-banner" class="hidden p-3 rounded-xl bg-blue-50 border border-blue-200 text-blue-900 text-xs shadow-xs flex items-center space-x-3">
                    <span class="text-base">📢</span>
                    <div>
                        <b class="font-bold uppercase text-[10px] text-blue-700">Мектеп хабарландыруы:</b>
                        <p id="announcement-text" class="mt-0.5"></p>
                    </div>
                </div>

                <div id="active-content-panel" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 min-h-[550px]"></div>
            </main>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white py-3 px-6 border-t border-slate-200 text-[11px] text-slate-500 flex justify-between items-center">
        <span class="font-bold text-slate-700">BilimClass Enterprise Cloud © 2026. Барлық құқықтар қорғалған.</span>
        <span class="text-emerald-600 font-bold flex items-center gap-1">● Бұлттық база қосылған</span>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB6JbuStN3ivrBMuca4RFFO_njwCN-jRSw",
            authDomain: "bilimland-app.firebaseapp.com",
            projectId: "bilimland-app",
            storageBucket: "bilimland-app.firebasestorage.app",
            messagingSenderId: "689912635683",
            appId: "1:689912635683:web:0ec438974e6fc894ac4146"
        };

        let useFirebase = false; 
        try {
            firebase.initializeApp(firebaseConfig);
            var db = firebase.firestore();
            useFirebase = true;
        } catch(e) { console.error(e); }

        let currentUser = null;
        let activeTab = '';
        let users = [];
        let classes = [];
        let schedules = [];
        let grades = {};
        let attendance = {};
        let ktpList = [];
        let supportTickets = [];
        let currentAnnouncement = '';

        window.onload = async function() {
            await loadDataFromCloud();
            if(!users.some(u => u.username === 'admin')) {
                users.push({ username: 'admin', password: 'admin2026', role: 'admin', name: 'Бас әкімші', warningReason: '', status: 'active' });
                await saveDataToCloud();
            }
        };

        async function loadDataFromCloud() {
            if(useFirebase) {
                try {
                    const snap = await db.collection("bilimland").doc("enterprise_data").get();
                    if(snap.exists) {
                        let data = snap.data();
                        users = data.users || [];
                        classes = data.classes || [];
                        schedules = data.schedules || [];
                        grades = data.grades || {};
                        attendance = data.attendance || {};
                        ktpList = data.ktpList || [];
                        supportTickets = data.supportTickets || [];
                        currentAnnouncement = data.announcement || '';
                    }
                } catch(e) { console.error(e); }
            }
        }

        async function saveDataToCloud() {
            if(useFirebase) {
                try {
                    await db.collection("bilimland").doc("enterprise_data").set({
                        users, classes, schedules, grades, attendance, ktpList, supportTickets, announcement: currentAnnouncement
                    });
                } catch(e) { console.error(e); }
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value.trim();
            const errorDiv = document.getElementById('login-error');

            await loadDataFromCloud();
            if(users.length === 0) {
                users.push({ username: 'admin', password: 'admin2026', role: 'admin', name: 'Бас әкімші', warningReason: '', status: 'active' });
                await saveDataToCloud();
            }

            const foundUser = users.find(u => u.username === usernameInput && u.password === passwordInput);
            if (foundUser) {
                if(foundUser.status === 'blocked') {
                    errorDiv.innerText = 'Аккаунт бұғатталған!';
                    errorDiv.classList.remove('hidden');
                    return;
                }
                currentUser = foundUser;
                errorDiv.classList.add('hidden');
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('welcome-text').innerText = currentUser.name;
                
                let roleTitle = 'Оқушы';
                if(currentUser.role === 'admin') roleTitle = 'Бас әкімші';
                else if(currentUser.role === 'teacher') roleTitle = 'Мұғалім';
                document.getElementById('welcome-role').innerText = roleTitle;

                if(currentUser.role === 'admin') activeTab = 'admin_monitoring';
                else if(currentUser.role === 'teacher') activeTab = 'teacher_journal';
                else activeTab = 'student_grades';

                checkBanners();
                renderSidebar();
                renderTabContent();
            } else {
                errorDiv.innerText = 'Қате логин немесе пароль!';
                errorDiv.classList.remove('hidden');
            }
        }

        function checkBanners() {
            // Announcement banner
            const annBanner = document.getElementById('announcement-banner');
            const annText = document.getElementById('announcement-text');
            if(currentAnnouncement) {
                annText.innerText = currentAnnouncement;
                annBanner.classList.remove('hidden');
            } else {
                annBanner.classList.add('hidden');
            }

            // Student warning banner
            const warnBanner = document.getElementById('student-warning-banner');
            const warnText = document.getElementById('student-warning-reason');
            if(currentUser.role === 'student' && currentUser.warningReason) {
                warnText.innerText = currentUser.warningReason;
                warnBanner.classList.remove('hidden');
            } else {
                warnBanner.classList.add('hidden');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('user-info').classList.add('hidden');
            document.getElementById('announcement-banner').classList.add('hidden');
            document.getElementById('student-warning-banner').classList.add('hidden');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
        }

        function renderSidebar() {
            const menu = document.getElementById('sidebar-menu');
            let links = [];
            if (currentUser.role === 'admin') {
                links = [
                    { id: 'admin_monitoring', label: '📊 Сыныптар мен оқушылар мониторингі' },
                    { id: 'admin_sanctions', label: '🛡️ Moderations & Sanctions' },
                    { id: 'admin_schedule', label: '📅 Сабақ кестесін жасау' },
                    { id: 'admin_users', label: '👥 Логин мен парольдерді реттеу' },
                    { id: 'admin_announcement', label: '📢 Хабарландыру тарату' }
                ];
            } else if (currentUser.role === 'teacher') {
                links = [
                    { id: 'teacher_journal', label: '📖 Бағалар журналы' },
                    { id: 'teacher_attendance', label: '📋 Қатысу журналы' },
                    { id: 'teacher_classes', label: '➕ Сынып ашу' },
                    { id: 'teacher_schedule', label: '📅 Сабақ кестесі' },
                    { id: 'teacher_ktp', label: '📑 КТЖ (Күнтізбелік жоспар)' },
                    { id: 'teacher_analytics', label: '📈 Аналитика және мониторинг' },
                    { id: 'teacher_support', label: '🛟 Қолдау қызметі' }
                ];
            } else {
                links = [
                    { id: 'student_grades', label: '📊 Менің бағаларым' },
                    { id: 'student_schedule', label: '📅 Менің кестем' },
                    { id: 'student_homework', label: '📚 Үй тапсырмасы' },
                    { id: 'student_contact', label: '💬 Мұғаліммен байланыс' },
                    { id: 'student_join', label: '🔑 Сыныпқа қосылу' },
                    { id: 'student_support', label: '🛟 Қолдау' }
                ];
            }
            menu.innerHTML = links.map(l => `
                <button onclick="switchTab('${l.id}')" class="sidebar-btn w-full text-left px-3 py-2 rounded-lg flex items-center justify-between ${activeTab === l.id ? 'active' : 'text-slate-600'}">
                    <span>${l.label}</span>
                </button>
            `).join('');
        }

        function switchTab(tabId) {
            activeTab = tabId;
            renderSidebar();
            renderTabContent();
        }

        async function renderTabContent() {
            await loadDataFromCloud();
            const panel = document.getElementById('active-content-panel');

            // --- ADMIN PANELS ---
            if (currentUser.role === 'admin') {
                if (activeTab === 'admin_monitoring') {
                    panel.innerHTML = `
                        <h3 class="text-sm font-extrabold text-slate-900 border-b pb-2 mb-3">📊 Мектеп бойынша сыныптар және БЖБ/ТЖБ мониторингі</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full gov-table">
                                <thead>
                                    <tr>
                                        <th>Сынып</th>
                                        <th>Жетекші мұғалім</th>
                                        <th>Оқушы саны</th>
                                        <th>Сабаққа қатысу</th>
                                        <th>БЖБ тапсыру %</th>
                                        <th>ТЖБ тапсыру %</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td><b>10 «А»</b></td>
                                        <td>Абдрахманова Д.</td>
                                        <td>24</td>
                                        <td>98%</td>
                                        <td>95%</td>
                                        <td>90%</td>
                                    </tr>
                                    <tr>
                                        <td><b>11 «Б»</b></td>
                                        <td>Қасымов М.</td>
                                        <td>21</td>
                                        <td>96%</td>
                                        <td>92%</td>
                                        <td>88%</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                } else if (activeTab === 'admin_sanctions') {
                    let studentList = users.filter(u => u.role === 'student').map(u => `
                        <tr class="text-xs">
                            <td class="font-bold">${u.name} (@${u.username})</td>
                            <td><span class="px-2 py-0.5 rounded font-bold ${u.status === 'blocked' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">${u.status === 'blocked' ? 'Бұғатталған' : 'Белсенді'}</span></td>
                            <td><span class="text-red-600 font-medium">${u.warningReason || 'Жоқ'}</span></td>
                            <td>
                                <button onclick="issueWarningPrompt('${u.username}')" class="px-2 py-1 bg-amber-500 text-white rounded font-bold hover:bg-amber-600">Ескерту беру</button>
                                <button onclick="toggleBlockUser('${u.username}')" class="px-2 py-1 ${u.status === 'blocked' ? 'bg-emerald-600' : 'bg-red-600'} text-white rounded font-bold">${u.status === 'blocked' ? 'Ашу' : 'Бұғаттау'}</button>
                            </td>
                        </tr>
                    `).join('');
                    panel.innerHTML = `
                        <h3 class="text-sm font-extrabold text-slate-900 border-b pb-2 mb-3">🛡️ Moderations & Sanctions (Тәртіп бақылауы)</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full gov-table">
                                <thead>
                                    <tr>
                                        <th>Оқушы аты-жөні</th>
                                        <th>Мәртебесі</th>
                                        <th>Берілген ескерту себебі</th>
                                        <th>Әрекеттер</th>
                                    </tr>
                                </thead>
                                <tbody>${studentList || '<tr><td colspan="4" class="text-center text-slate-400">Оқушылар тіркелмеген</td></tr>'}</tbody>
                            </table>
                        </div>
                    `;
                } else if (activeTab === 'admin_schedule') {
                    panel.innerHTML = `
                        <h3 class="text-sm font-extrabold text-slate-900 border-b pb-2 mb-3">📅 Сабақ кестесін бекіту (Әр сыныпқа жеке)</h3>
                        <div class="p-4 bg-slate-50 rounded-lg border max-w-lg space-y-3">
                            <select class="w-full border rounded p-2 text-xs bg-white"><option>10 «А» сыныбы</option><option>11 «Б» сыныбы</option></select>
                            <input type="text" placeholder="Пән мен уақыты (Мысалы: Дүйсенбі 08:30 - Алгебра)" class="w-full border rounded p-2 text-xs bg-white">
                            <button onclick="alert('Сабақ кестесі сыныпқа сәтті бекітілді!')" class="px-4 py-2 bg-blue-600 text-white rounded text-xs font-bold">Кестені сақтау</button>
                        </div>
                    `;
                } else if (activeTab === 'admin_users') {
                    let allUsersList = users.map(u => `
                        <tr class="text-xs">
                            <td class="font-bold">${u.name}</td>
                            <td>@${u.username}</td>
                            <td><b>${u.password}</b></td>
                            <td><span class="px-2 py-0.5 rounded font-bold uppercase text-[9px] ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : u.role === 'teacher' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}">${u.role}</span></td>
                            <td>${u.username !== 'admin' ? `<button onclick="deleteSystemUser('${u.username}')" class="px-2 py-1 bg-red-50 text-red-600 rounded font-bold">Жою</button>` : '—'}</td>
                        </tr>
                    `).join('');
                    panel.innerHTML = `
                        <h3 class="text-sm font-extrabold text-slate-900 border-b pb-2 mb-3">👥 Логин мен парольдерді басқару және тіркеу</h3>
                        <div class="p-4 bg-slate-50 rounded-lg border mb-4">
                            <h4 class="text-xs font-bold mb-2 text-slate-700">Жаңа пайдаланушы қосу</h4>
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-2">
                                <input type="text" id="reg-name" placeholder="Аты-жөні" class="border rounded p-2 text-xs bg-white">
                                <input type="text" id="reg-user" placeholder="Логин" class="border rounded p-2 text-xs bg-white">
                                <input type="text" id="reg-pass" placeholder="Пароль" class="border rounded p-2 text-xs bg-white">
                                <select id="reg-role" class="border rounded p-2 text-xs font-bold bg-white"><option value="student">Оқушы</option><option value="teacher">Мұғалім</option></select>
                            </div>
                            <button onclick="registerNewUser()" class="px-4 py-2 bg-blue-600 text-white rounded text-xs font-bold">+ Тіркеу</button>
                        </div>
                        <div class="overflow-x-auto"><table class="w-full gov-table"><thead><tr><th>Аты-жөні</th><th>Логин</th><th>Пароль</th><th>Рөлі</th><th>Әрекет</th></tr></thead><tbody>${allUsersList}</tbody></table></div>
                    `;
                } else if (activeTab === 'admin_announcement') {
                    panel.innerHTML = `
                        <h3 class="text-sm font-extrabold text-slate-900 border-b pb-2 mb-3">📢 Мектеп бойынша хабарландыру тарату</h3>
                        <div class="p-4 bg-slate-50 rounded-lg border space-y-3 max-w-xl">
                            <textarea id="announcement-input" rows="4" class="w-full border rounded p-3 text-xs bg-white" placeholder="Барлық оқушылар мен мұғалімдерге хабарлама жазыңыз...">${currentAnnouncement}</textarea>
                            <div class="flex space-x-2">
                                <button onclick="saveAnnouncement()" class="px-4 py-2 bg-blue-600 text-white rounded text-xs font-bold">📢 Жариялау</button>
                                <button onclick="clearAnnouncement()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded text-xs font-bold">Өшіру</button>
                            </div>
                        </div>
                    `;
                }
            }
            // --- TEACHER PANELS ---
            else if (currentUser.role === 'teacher') {
                if (activeTab === 'teacher_journal') {
                    let students = users.filter(u => u.role === 'student');
                    panel.innerHTML = `
                        <h3 class="text-sm font-extrabold text-slate-900 border-b pb-2 mb-3">📖 Электронды журнал (Формативті (10 балдық) және БЖБ/ТЖБ)</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full gov-table">
                                <thead>
                                    <tr>
                                        <th>Оқушы аты-жөні</th>
                                        <th>Формативті (макс. 10)</th>
                                        <th>БЖБ (жинады / макс.)</th>
                                        <th>ТЖБ (жинады / макс.)</th>
                                        <th>Қорытынды</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${students.length > 0 ? students.map(s => `
                                        <tr>
                                            <td class="font-bold text-left">${s.name}</td>
                                            <td><input type="text" class="w-16 text-center border rounded py-1" placeholder="8/10" value="9/10"></td>
                                            <td><input type="text" class="w-20 text-center border rounded py-1 font-bold text-blue-600" placeholder="18/20" value="18/20"></td>
                                            <td><input type="text" class="w-20 text-center border rounded py-1 font-bold text-indigo-600" placeholder="27/30" value="27/30"></td>
                                            <td class="font-extrabold text-emerald-600">5</td>
                                        </tr>

                } else if (activeTab === 'teacher_attendance') {

                            <input type="text" placeholder="Сынып аты (Мысалы: 10 «В»)" class="w-full border rounded p-2 text-xs bg-white">

                } else if (activeTab === 'teacher_schedule') {
                    panel.innerHTML = `<h3 class="text-sm font-extrabold text-slate-900 border-b pb-2 mb-3">📅 Менің сабақ кестем</h3><p class="text-xs text-slate-500">Бекітілген кестелер осында көрінеді.</p>`;

                } else if (activeTab === 'student_contact') {
                    panel.innerHTML = `<h3 class="text-sm font-extrabold text-slate-900 border-b pb-2 mb-3">💬 Мұғаліммен байланыс</h3><p class="text-xs text-slate-500">Пән мұғалімдеріне хат жазу.</p>`;

        async function registerNewUser() {
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-user').value.trim();
            const password = document.getElementById('reg-pass').value.trim();
            const role = document.getElementById('reg-role').value;

            if(!name || !username || !password) return alert('Барлық өрістерді толтырыңыз!');
            if(users.some(u => u.username === username)) return alert('Бұл логин бос емес!');

            users.push({ name, username, password, role, warningReason: '', status: 'active' });
            await saveDataToCloud();
            alert('Сәтті тіркелді!');
            renderTabContent();
        }

        async function deleteSystemUser(username) {
            if(confirm('Өшіргіңіз келе ме?')) {
                users = users.filter(u => u.username !== username);
                await saveDataToCloud();
                renderTabContent();
            }
        }

        async function issueWarningPrompt(username) {
            let reason = prompt('Оқушыға ескерту беру себебін енгізіңіз:');
            if(reason === null) return;
            let u = users.find(x => x.username === username);
            if(!u) return;
            u.warningReason = reason;
            await saveDataToCloud();
            alert('Ескерту себебімен қоса сәтті берілді!');
            renderTabContent();
        }

        async function toggleBlockUser(username) {
            let u = users.find(x => x.username === username);
            if(!u) return;
            u.status = u.status === 'blocked' ? 'active' : 'blocked';
            await saveDataToCloud();
            renderTabContent();
        }

        async function saveAnnouncement() {
            const text = document.getElementById('announcement-input').value.trim();
            currentAnnouncement = text;
            await saveDataToCloud();
            checkBanners();
            alert('Хабарландыру сәтті жарияланды!');
        }

        async function clearAnnouncement() {
            currentAnnouncement = '';
            await saveDataToCloud();
            checkBanners();
            document.getElementById('announcement-input').value = '';
            alert('Хабарландыру өшірілді!');
        }
    </script>
</body>
</html>
