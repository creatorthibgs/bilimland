<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimLand — Бұлттық білім беру жүйесі (Enterprise)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        .glass-light {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }
        .sidebar-item-active {
            background-color: rgba(37, 99, 235, 0.1);
            color: #2563eb;
            border-right: 3px solid #2563eb;
            font-weight: 700;
        }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50/30 to-indigo-50/40 text-slate-800 min-h-screen font-sans relative flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <header class="sticky top-0 z-30 py-3 px-6 glass-light border-b border-white/80 shadow-xs flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-black text-white text-base shadow-md shadow-blue-500/20">BL</div>
            <div>
                <h1 class="text-sm font-black tracking-tight text-slate-900">BilimLand <span class="text-[10px] px-2 py-0.5 bg-blue-500/10 text-blue-600 rounded-full border border-blue-500/20 font-bold ml-1">Cloud Enterprise</span></h1>
                <p class="text-[10px] text-slate-500">Бұлттық электронды журнал</p>
            </div>
        </div>
        <div id="user-info" class="hidden flex items-center space-x-4">
            <div class="text-right">
                <span id="welcome-text" class="text-xs font-bold text-slate-800 block"></span>
                <span id="welcome-role" class="text-[10px] text-blue-600 font-semibold block uppercase"></span>
            </div>
            <button onclick="logout()" class="px-3 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 border border-slate-200 hover:border-rose-200 rounded-xl text-xs font-bold transition-all shadow-2xs">Шығу</button>
        </div>
    </header>

    <div class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">
        <div id="login-section" class="w-full max-w-md mx-auto glass-card p-8 md:p-10 rounded-3xl transition-all duration-300">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">Қауіпсіз кіру</h2>
                <p class="text-slate-500 text-xs mt-1">Әкімші берген жеке реквизиттеріңізді енгізіңіз</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Логин</label>
                    <input type="text" id="login-username" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 text-sm text-slate-800 transition-all placeholder:text-slate-400 shadow-2xs" placeholder="Логиніңіз">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Пароль</label>
                    <input type="password" id="login-password" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 text-sm text-slate-800 transition-all placeholder:text-slate-400 shadow-2xs" placeholder="••••••••">
                </div>
                <div id="login-error" class="hidden text-rose-600 text-xs text-center font-bold bg-rose-50 border border-rose-100 py-2.5 rounded-xl"></div>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl font-bold text-sm shadow-md shadow-blue-600/20 transition-all active:scale-[0.99]">Жүйеге кіру</button>
            </form>
        </div>

        <div id="dashboard-section" class="hidden grid grid-cols-1 md:grid-cols-4 gap-6 w-full items-start">
            <aside class="glass-card rounded-2xl p-4 md:col-span-1 shadow-xs border border-white/80 sticky top-20">
                <div class="text-xs font-bold uppercase text-slate-400 tracking-wider mb-3 px-3">Басқару мәзірі</div>
                <nav id="sidebar-menu" class="space-y-1 text-xs font-semibold text-slate-600"></nav>
            </aside>
            <main class="md:col-span-3 space-y-4">
                <div id="announcement-banner" class="hidden glass-light p-4 rounded-2xl border-blue-200 bg-blue-50/80 flex justify-between items-center shadow-2xs">
                    <div>
                        <h4 class="text-[11px] font-bold uppercase tracking-wider text-blue-600">📢 Әкімші хабарландыруы:</h4>
                        <p id="announcement-text" class="text-xs text-slate-700 mt-0.5 font-medium"></p>
                    </div>
                </div>
                <div id="active-content-panel" class="glass-card p-6 rounded-3xl min-h-[450px]"></div>
            </main>
        </div>
    </div>

    <footer class="glass-light rounded-2xl p-5 my-4 mx-4 md:mx-8 shadow-2xs text-xs text-slate-500 flex flex-col md:flex-row justify-between items-center gap-3 border border-white/80">
        <div class="flex items-center space-x-2">
            <span class="font-extrabold text-slate-800">BilimLand Cloud Enterprise © 2026.</span>
            <span>Барлық құқықтар қорғалған.</span>
        </div>
    </footer>

    <script>
        // === ЖАҢА FIREBASE КОНФИГУРАЦИЯСЫ ===
        const firebaseConfig = {
            apiKey: "AIzaSyB6JbuStN3ivrBMuca4RFFO_njwCN-jRSw",
            authDomain: "bilimland-app.firebaseapp.com",
            projectId: "bilimland-app",
            storageBucket: "bilimland-app.firebasestorage.app",
            messagingSenderId: "689912635683",
            appId: "1:689912635683:web:0ec438974e6fc894ac4146"
        };

        let useFirebase = false; 
        try {
            firebase.initializeApp(firebaseConfig);
            var db = firebase.firestore();
            useFirebase = true;
        } catch(e) {
            console.log("Firebase қатесі:", e);
        }

        const badWords = ['лай', 'дурак', 'мал', 'акмак', 'ңңс', 'блять', 'сука', 'пароль бер'];

        let currentUser = null;
        let activeTab = 'home';
        let users = [];
        let classes = [];
        let grades = {};
        let supportTickets = [];
        let currentAnnouncement = '';

        window.onload = async function() {
            await loadDataFromCloud();
            if(!users.some(u => u.username === 'admin')) {
                users.push({ username: 'admin', password: 'admin2026', role: 'admin', name: 'Бас әкімші', warnings: 0, status: 'active' });
                await saveDataToCloud();
            }
        };

        async function loadDataFromCloud() {
            if(useFirebase) {
                try {
                    const snap = await db.collection("bilimland").doc("main_data").get();
                    if(snap.exists) {
                        let data = snap.data();
                        users = data.users || [];
                        classes = data.classes || [];
                        grades = data.grades || {};
                        supportTickets = data.supportTickets || [];
                        currentAnnouncement = data.announcement || '';
                    }
                } catch(e) { console.error("Жүктеу қатесі:", e); }
            }
        }

        async function saveDataToCloud() {
            if(useFirebase) {
                try {
                    await db.collection("bilimland").doc("main_data").set({
                        users, classes, grades, supportTickets, announcement: currentAnnouncement
                    });
                } catch(e) { console.error("Сақтау қатесі:", e); }
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value.trim();
            const errorDiv = document.getElementById('login-error');

            await loadDataFromCloud();
            
            if(users.length === 0) {
                users.push({ username: 'admin', password: 'admin2026', role: 'admin', name: 'Бас әкімші', warnings: 0, status: 'active' });
                await saveDataToCloud();
            }

            const foundUser = users.find(u => u.username === usernameInput && u.password === passwordInput);

            if (foundUser) {
                if (foundUser.status === 'blocked') {
                    errorDiv.innerText = 'Аккаунт бұғатталған!';
                    errorDiv.classList.remove('hidden');
                    return;
                }
                currentUser = foundUser;
                errorDiv.classList.add('hidden');
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('welcome-text').innerText = currentUser.name;
                document.getElementById('welcome-role').innerText = currentUser.role === 'admin' ? 'Бас әкімші' : currentUser.role === 'teacher' ? 'Мұғалім' : 'Оқушы';

                activeTab = currentUser.role === 'admin' ? 'users' : currentUser.role === 'teacher' ? 'journal' : 'my_grades';
                renderSidebar();
                renderTabContent();
            } else {
                errorDiv.innerText = 'Қате логин немесе пароль!';
                errorDiv.classList.remove('hidden');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('user-info').classList.add('hidden');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-error').classList.add('hidden');
        }

        function renderSidebar() {
            const menu = document.getElementById('sidebar-menu');
            let links = [];
            if (currentUser.role === 'admin') {
                links = [
                    { id: 'users', label: '👥 Пайдаланушылар' },
                    { id: 'sanctions', label: '🛡️ Санкциялар' },
                    { id: 'classes', label: '🏫 Сыныптар' },
                    { id: 'announcement', label: '📢 Хабарландыру' },
                    { id: 'support', label: '🛠️ Қолдау' }
                ];
            } else if (currentUser.role === 'teacher') {
                links = [
                    { id: 'journal', label: '📖 Журнал' },
                    { id: 'create_class', label: '➕ Сынып ашу' },
                    { id: 'support', label: '🛟 Қолдау' }
                ];
            } else {
                links = [
                    { id: 'my_grades', label: '📊 Бағаларым' },
                    { id: 'join_class', label: '🔑 Сыныпқа қосылу' },
                    { id: 'support', label: '🛟 Қолдау' }
                ];
            }
            menu.innerHTML = links.map(l => `
                <button onclick="switchTab('${l.id}')" class="w-full text-left px-3 py-2.5 rounded-xl transition-all flex items-center justify-between ${activeTab === l.id ? 'sidebar-item-active' : 'hover:bg-slate-100/80'}">
                    <span>${l.label}</span>
                </button>
            `).join('');
        }

        function switchTab(tabId) {
            activeTab = tabId;
            renderSidebar();
            renderTabContent();
        }

        async function renderTabContent() {
            await loadDataFromCloud();
            const panel = document.getElementById('active-content-panel');
            if (currentUser.role === 'admin') {
                if (activeTab === 'users') {
                    let usersList = users.map(u => `
                        <div class="flex justify-between items-center py-2 px-3 bg-white rounded-xl mb-2 border border-slate-200 text-xs">
                            <div><b>${u.name}</b> (@${u.username}) <span class="text-blue-600">[${u.role}]</span></div>
                            ${u.username !== 'admin' ? `<button onclick="deleteUser('${u.username}')" class="px-2 py-1 bg-rose-50 text-rose-600 border border-rose-200 rounded-lg font-bold">Жою</button>` : ''}
                        </div>
                    `).join('');
                    panel.innerHTML = `
                        <h3 class="text-base font-black mb-4 text-slate-900 border-b pb-2">Пайдаланушыларды басқару</h3>
                        <div class="p-4 bg-white/90 rounded-2xl border mb-4">
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-2">
                                <input type="text" id="new-name" placeholder="Аты-жөні" class="border rounded-xl px-3 py-2 text-xs">
                                <input type="text" id="new-user" placeholder="Логин" class="border rounded-xl px-3 py-2 text-xs">
                                <input type="text" id="new-pass" placeholder="Пароль" class="border rounded-xl px-3 py-2 text-xs">
                                <select id="new-role" class="border rounded-xl px-3 py-2 text-xs"><option value="student">Оқушы</option><option value="teacher">Мұғалім</option></select>
                            </div>
                            <button onclick="addNewUser()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Тіркеу</button>
                        </div>
                        <div>${usersList}</div>
                    `;
                }
            }
        }

        async function addNewUser() {
            const name = document.getElementById('new-name').value.trim();
            const username = document.getElementById('new-user').value.trim();
            const password = document.getElementById('new-pass').value.trim();
            const role = document.getElementById('new-role').value;
            if(!name || !username || !password) return alert('Барлығын толтырыңыз!');
            users.push({ name, username, password, role, warnings: 0, status: 'active' });
            await saveDataToCloud();
            alert('Сақталды!');
            renderTabContent();
        }

        async function deleteUser(username) {
            users = users.filter(u => u.username !== username);
            await saveDataToCloud();
            renderTabContent();
        }
    </script>
</body>
</html>
